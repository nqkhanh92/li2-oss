<style>
/* ============ TOKEN (globals.css @theme :36-135) ============ */
:root {

  --foreground: oklch(0.2795 0.0368 260.03);

  --secondary-blue: hsl(220 92% 62%);
  --secondary-purple: oklch(0.4141 0.2126 280.37);
  --secondary-orange: oklch(0.6776 0.192952 45.2346);
  --secondary-dark-cyan: oklch(0.6548 0.1094 194.81);

/* ============ .dark (globals.css :189-242) ============ */
.dark {

  --foreground: hsl(210 40% 96%);        /* globals :193 = var(--color-slate-100) light = hsl(210 40% 96%) */

  --slate-50: oklch(0.25 0.009 264);
  --slate-100: oklch(0.27 0.008 264);
  --slate-200: oklch(0.32 0.01 264);
  --slate-300: oklch(0.38 0.012 264);
  --slate-400: oklch(0.55 0.015 264);
  --slate-500: oklch(0.68 0.012 264);

/* ============ Nền tảng ============ */
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body {
  margin: 0; background: var(--slate-800); color: var(--foreground);
  font-family: "Be Vietnam Pro", Arial, Helvetica, sans-serif;
  font-size: var(--text-s); line-height: var(--lh-s);
  height: 100vh; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; }
a { color: inherit; }
svg.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }

/* ============ Khung app Li2 ============ */
#app { position: absolute; inset: 0; display: flex; flex-direction: column; }
.navbar { height: var(--h-navbar); background: var(--slate-800); color: #fff; display: flex; align-items: center; padding: 0 48px 0 24px; gap: 16px; flex: none; }
.dark .navbar { background: oklch(0.14 0.008 264); }
.navbar .logo { width: 150px; height: 36px; display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: var(--text-base); }
.navbar .logo i { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, var(--secondary), var(--secondary-blue)); display: inline-flex; align-items: center; justify-content: center; }
.navbar .logo i svg { width: 14px; height: 14px; }
.navbar .org { display: flex; align-items: center; gap: 8px; border-left: 1px solid rgb(255 255 255 / .3); padding: 0 24px; height: 24px; font-size: var(--text-s); }
.navbar .org .ob { width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(90deg, #B9AAFF 0.08%, #D6A4AF 98.87%); display: inline-flex; align-items: center; justify-content: center; }
.navbar .org .ob svg { width: 14px; height: 14px; }
.navbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.navbar .lang { display: flex; align-items: center; gap: 4px; padding: 8px; font-size: var(--text-xs); font-weight: 500; }
.navbar .bell { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; }
.navbar .user { display: flex; align-items: center; gap: 8px; margin-left: 24px; font-size: var(--text-xs); }
.navbar .user .av { width: 32px; height: 32px; border-radius: 999px; background: var(--secondary-orange); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; font-size: 12px; }
.shell { flex: 1; display: flex; min-height: 0; }
.sidebar { width: var(--w-sidebar); flex: none; background: var(--sidebar); color: var(--sidebar-foreground); border-top-left-radius: 24px; padding: 16px 24px 24px; display: flex; flex-direction: column; gap: 2px; position: relative; }
.sidebar .grp { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--slate-400); padding: 12px 8px 6px; }
.sidebar .mi { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px 0 8px; border-radius: 8px; border-left: 4px solid transparent; font-size: var(--text-s); color: var(--sidebar-foreground); width: 100%; text-align: left; }
.sidebar .mi svg { width: 20px; height: 20px; }
.sidebar .mi:hover { background: var(--sidebar-accent); color: var(--primary); border-left-color: var(--primary); box-shadow: var(--shadow-side); }
.sidebar .mi.on { background: var(--sidebar-accent); color: var(--primary); border-left-color: var(--primary); box-shadow: var(--shadow-side); }
.sidebar .collapse { position: absolute; top: 24px; right: 8px; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; color: var(--slate-500); }
.sidebar .collapse svg { width: 14px; height: 14px; }
.main { flex: 1; min-width: 0; background: var(--background); display: flex; flex-direction: column; }
.pagenav { height: var(--h-pagenav); min-height: var(--h-pagenav); border-bottom: 1px solid var(--border); padding: 0 48px; display: flex; align-items: center; flex: none; }
.pagenav .inner { height: 100%; display: flex; align-items: center; gap: 12px; width: 100%; max-width: var(--w-content); margin: 0 auto; min-width: 0; }
.pagenav h3 { margin: 0; font-size: var(--text-l); line-height: var(--lh-l); font-weight: 500; color: var(--foreground); }
.pagenav .extra { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.pagenav .back { width: 20px; height: 20px; color: var(--slate-500); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.pagenav .back svg { width: 20px; height: 20px; }
.pagebody { flex: 1; overflow-y: auto; padding: 24px 48px; min-height: 0; }
.pagebody > .inner { max-width: var(--w-content); margin: 0 auto; }
.pagefoot { height: 60px; flex: none; border-top: 1px solid var(--slate-300); background: var(--background); display: flex; align-items: center; justify-content: center; gap: 16px; }
.pagefoot .reason { position: absolute; margin-top: 56px; font-size: var(--text-xs); color: var(--slate-500); }

/* ============ Nguyên tử (ui/button.tsx, badge, input) ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--r-btn); font-size: 14px; font-weight: 500; line-height: 20px; border: 1px solid transparent; white-space: nowrap; transition: background-color .15s, color .15s, border-color .15s; }
.btn svg { width: 20px; height: 20px; }
.btn.sm { height: 36px; font-size: 14px; }
.btn.sm svg { width: 18px; height: 18px; }
.btn.xs { height: 32px; padding: 0 8px; font-size: var(--text-xs); }
.btn.icon { width: 36px; height: 36px; padding: 0; }
.btn.icon svg { width: 18px; height: 18px; }
.btn.default { background: var(--primary); color: var(--primary-foreground); }
.btn.default:hover { background: var(--primary-light); }
.btn.secondary { background: var(--card); color: var(--slate-700); border-color: var(--slate-200); }
.btn.secondary:hover { color: var(--primary-light); }
.btn.tertiary { background: transparent; color: var(--slate-700); }
.btn.tertiary:hover { background: var(--slate-50); color: var(--primary-light); }
.btn.table { background: var(--neutral-400); color: var(--primary); width: 28px; height: 28px; padding: 0; border-radius: 8px; }
.btn.table:hover { background: var(--neutral-500); }
.btn.table svg { width: 16px; height: 16px; }
.btn.danger { background: var(--semantic-error); color: #fff; }
.btn.danger:hover { filter: brightness(1.08); }
.btn:disabled, .btn.disabled { opacity: .3; pointer-events: none; }
.btn.busy { pointer-events: none; }
.btn.full { width: 100%; }
.btn.round { width: 28px; height: 28px; padding: 0; border-radius: 999px; }
.btn.round svg { width: 16px; height: 16px; }
.spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 999px; display: inline-block; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.input { height: 40px; width: 100%; border: 1px solid var(--slate-300); background: var(--card); border-radius: 8px; padding: 0 12px; display: flex; align-items: center; gap: 8px; font-size: var(--text-s); color: var(--foreground); }
.input input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: inherit; height: 100%; padding: 0; font-size: var(--text-s); }
.input input::placeholder { color: var(--slate-400); }
.input.muted { background: var(--slate-100); border-color: transparent; }
.input.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.input.mono input { font-family: inherit; font-size: 13px; }
.input .pre { color: var(--slate-500); font-size: var(--text-s); flex: none; }
.input .ad { margin-left: auto; color: var(--slate-500); display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 999px; flex: none; }
.input .ad:hover { background: var(--slate-100); color: var(--foreground); }
.input .ad svg { width: 16px; height: 16px; }
.input:focus-within { border-color: var(--primary-light); }
.input.bad { border-color: var(--semantic-error); }
.input.ro { background: var(--slate-50); }
.label { font-size: var(--text-s); font-weight: 500; color: var(--slate-700); line-height: 20px; }
.hint { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--slate-500); }
.err { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--semantic-error); }
.field { display: flex; flex-direction: column; gap: 6px; }
.sep { height: 1px; background: var(--border); }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: var(--text-xs); line-height: 16px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; flex: none; }
.badge.neutral { background: var(--slate-100); color: var(--slate-600); border-color: var(--slate-200); }
.badge.success { background: color-mix(in oklab, var(--semantic-success) 10%, transparent); color: var(--semantic-success); border-color: color-mix(in oklab, var(--semantic-success) 25%, transparent); }
.badge.info { background: color-mix(in oklab, var(--semantic-info) 10%, transparent); color: var(--semantic-info); border-color: color-mix(in oklab, var(--semantic-info) 25%, transparent); }
.badge.warning { background: color-mix(in oklab, var(--semantic-warning) 10%, transparent); color: var(--semantic-warning); border-color: color-mix(in oklab, var(--semantic-warning) 25%, transparent); }
.badge.error { background: color-mix(in oklab, var(--semantic-error) 10%, transparent); color: var(--semantic-error); border-color: color-mix(in oklab, var(--semantic-error) 25%, transparent); }
.badge.gray { background: var(--slate-100); color: var(--slate-500); font-weight: 400; padding: 2px 8px; }
.badge.gray svg { width: 12px; height: 12px; }

.chk { width: 16px; height: 16px; border: 1.5px solid var(--slate-400); border-radius: 4px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--card); color: var(--primary-foreground); }
.chk svg { width: 12px; height: 12px; opacity: 0; }
.chk.on { background: var(--primary); border-color: var(--primary); }
.chk.on svg { opacity: 1; }
.chk.mix::after { content: ""; width: 8px; height: 2px; background: var(--primary-foreground); }
.chk.mix { background: var(--primary); border-color: var(--primary); }

/* tooltip nhỏ bằng data-tip */
[data-tip] { position: relative; }
[data-tip]::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: var(--slate-800); color: #fff; font-size: var(--text-xs); line-height: 16px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 20; }
.dark [data-tip]::after { background: var(--slate-700); color: var(--slate-50); }
[data-tip]:hover::after { opacity: 1; }
[data-tip].tip-left::after { left: auto; right: 0; transform: none; }

/* ============ Danh sách ============ */
.tools { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.tools .filters { display: flex; align-items: center; gap: 8px; }
.tools .search { width: 250px; }
.sq { width: 40px; height: 40px; border: 1px solid var(--slate-300); border-radius: 6px; background: var(--card); display: inline-flex; align-items: center; justify-content: center; color: var(--slate-600); }
.sq svg { width: 18px; height: 18px; }
.sq.off { opacity: .5; cursor: not-allowed; }
.thead { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; border-bottom: 2px solid var(--slate-100); font-size: var(--text-s); color: var(--slate-500); font-weight: 500; margin-top: 16px; min-height: 40px; }
.thead .bulk { display: inline-flex; align-items: center; gap: 8px; }
.rows { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.row-card { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--slate-300); border-radius: var(--r-card); padding: 16px 16px 16px 8px; position: relative; cursor: pointer; transition: border-color .15s; width: 100%; min-width: 0; }
.row-card:hover { border-color: var(--primary); }
.row-card.sel { background: var(--slate-50); }
.row-card.removed { opacity: .92; }

function qrSvg(seed, color) {
  const n = 25; let h = 0; for (const ch of String(seed || 'x')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const cells = [];
  const finder = (x, y) => { for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) { const edge = i === 0 || j === 0 || i === 6 || j === 6; const core = i >= 2 && i <= 4 && j >= 2 && j <= 4; if (edge || core) cells.push([x + j, y + i]); } };
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
  const inFinder = (x, y) => (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { if (inFinder(x, y)) continue; if ((x === 6 || y === 6) ? ((x + y) % 2 === 0) : rnd() < 0.42) cells.push([x, y]); }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" fill="${color || '#1a1a2e'}" aria-hidden="true">${cells.map(([x, y]) => `<rect x="${x}" y="${y}" width="1" height="1"/>`).join('')}</svg>`;

function parseHash() {
  const h = location.hash || '#/artifacts';
  const [path, qs] = h.slice(1).split('?');
  const q = Object.fromEntries(new URLSearchParams(qs || ''));
  const p = path.split('/').filter(Boolean);
  if (p[0] === 'a' && p[1]) return { name: 'public', token: p[1], q };
  if (p[0] === 'artifacts' && p[1] === 'new') return { name: 'create', q };
  if (p[0] === 'artifacts' && p[1]) return { name: 'detail', id: p[1], tab: q.tab || 'content', q };
  return { name: 'list', q };
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

  const replaceSec = `<div class="section" id="sec-replace">

  const previewSec = `<div class="section" id="sec-preview">

    </div>`;
    const m = a.access_mode;
    if (!S.ac || S.ac.id !== a.id) S.ac = { id: a.id, phase: 'edit', form: { mode: a.access_mode, password: '', show: false }, busy: false, password: null };
    const whoViewed = m === 'google' && isLive ? `
      <div>

        <div class="diff" style="margin-top:8px">
          ${['minh.tran@gmail.com', 'lan.nguyen@gmail.com', 'hoang.le@gmail.com'].map((e, i) => `<div class="r" style="grid-template-columns:1fr auto"><span>${e}</span><span class="hint">${rel(NOW - (i + 1) * 5 * H)}</span></div>`).join('')}
        </div>
      </div>` : '';
    const accessSec = `<div class="section" id="sec-access">
      <div class="sechead"><h2>Quyền xem</h2><p>Đang là <b>${T.access[m].label}</b>${m === 'password' ? ` · đặt ${rel(a.password_set_at || a.created_at)}` : ''}. ${isDraft ? 'Chế độ này áp dụng ngay khi bạn xuất bản.' : 'Đổi chế độ có hiệu lực ngay, không sinh link mới.'}</p></div>

  let analyticsSec = '';
  if (isLive) {
    const days = 14; let h = 7;
    const vals = Array.from({ length: days }, (_, i) => { h = (h * 1103515245 + 12345 + a.visits * (i + 1)) % 2147483648; return 1 + (h % Math.max(2, Math.round(a.visits / days * 1.6))); });
    const max = Math.max(...vals);
    const W = 760, Hh = 200, pad = 28, bw = (W - pad * 2) / days;
    const bars = vals.map((v, i) => { const bh = (v / max) * (Hh - pad - 10); const x = pad + i * bw + 4; const y = Hh - pad - bh; const d = new Date(NOW - (days - 1 - i) * D); return `<rect class="bar" x="${x}" y="${y}" width="${bw - 8}" height="${bh}" rx="3"><title>${d.getDate()}/${d.getMonth() + 1}: ${v} lượt</title></rect><text x="${x + (bw - 8) / 2}" y="${Hh - 10}" text-anchor="middle">${d.getDate()}/${d.getMonth() + 1}</text>`; }).join('');
    analyticsSec = `<div class="section" id="sec-analytics">
      <div class="sechead"><h2>Phân tích</h2><p>Lượt quét theo ngày trong 14 ngày gần nhất, ghi từ bảng visits qua touch point của artifact.</p></div>
      <div class="stats">

        <div class="stat"><span class="hint">Người xem riêng</span><div class="n">${fmtN(Math.round(a.visits * 0.66))}</div></div>

  }
  const rpanel = `
      <div class="rpanel">
        <div class="qrcard">
          <div class="hd"><span class="lb label">Mã QR ${I.help}</span><div class="acts">
            ${isLive ? `<button type="button" class="btn tertiary round" data-act="dl-qr" data-id="${a.id}" data-tip="Tải QR">${I.download}</button><button type="button" class="btn tertiary round" data-act="toast" data-msg="Đã sao chép mã QR" data-tip="Sao chép">${I.copy}</button>`
                     : `<span data-tip="Xuất bản trước đã" class="tip-left"><button type="button" class="btn tertiary round" disabled>${I.download}</button></span><span data-tip="Xuất bản trước đã" class="tip-left"><button type="button" class="btn tertiary round" disabled>${I.copy}</button></span>`}

          <div class="box"><div class="qr${isLive ? '' : ' dim'}">${qrSvg(a.token || 'placeholder')}</div></div>
          ${isDraft ? `<span class="hint">Xuất bản trước đã — mã QR sinh theo link rút gọn.</span>` : ''}
        </div>
        <div class="qrcard">
          <span class="label">Thông tin file</span>
          <div class="metarow"><span>Tên</span><span class="truncate">${esc(a.name)}</span></div>

          <div class="metarow"><span>Dung lượng</span><span>${fmtBytes(a.size_bytes)}</span></div>
          <div class="metarow"><span>Tạo lúc</span><span>${rel(a.created_at)}</span></div>
          <div class="metarow"><span>Cập nhật lúc</span><span>${rel(a.updated_at)}</span></div>
        </div>
      </div>`;
  const center = linkSec + replaceSec + previewSec + accessSec + analyticsSec;
  return header + `<div class="pagebody"><div class="inner"><div class="formgrid"><div class="merged"><div class="center">${center}</div>${rpanel}</div></div></div></div>`;
}

/* ===================================================== DIALOGS */
function dialogHtml() {

      <div class="body">

        <div style="display:flex;flex-direction:column;align-items:center;gap:12px">

          <div class="row" style="width:100%"><button type="button" class="btn secondary sm grow" data-act="toast" data-msg="Đã sao chép mã QR">${I.copy}Sao chép QR</button><button type="button" class="btn secondary sm grow" data-act="dl-qr" data-id="${a.id}">${I.download}Tải QR</button></div>

      <div class="body"><div class="foot"><button type="button" class="btn secondary sm" data-act="dlg-close">Huỷ</button><button type="button" class="btn danger sm${d.busy ? ' busy' : ''}" data-act="delete-confirm">${d.busy ? '<span class="spin"></span>' : ''}Xoá vĩnh viễn</button></div></div>`);
  }

  if (d.type === 'share') {
    const url = shortUrl(a);
    return wrap(`${X}<h4>Chia sẻ</h4><p class="desc">${esc(a.name)}</p><div class="hr"></div><div class="body">
      <div class="input mono ro"><input readonly value="${esc(url)}" /><button type="button" class="ad" data-act="copy" data-text="${esc(url)}">${I.copy}</button></div>
      <div class="row" style="gap:8px;flex-wrap:wrap">${['Zalo', 'Facebook', 'Email', 'Messenger'].map((n) => `<button type="button" class="btn secondary sm" data-act="toast" data-msg="Prototype: mở ${n}">${n}</button>`).join('')}</div>

  if (d.type === 'password') {

      <div class="notice warning"><span class="ni">${I.warn}</span><div>Mọi người đang xem sẽ phải nhập lại mật khẩu mới. Mã QR và link ngắn không đổi.</div></div>

}

function acCheck(d, a) {
  const f = d.form;
  const changed = f.mode !== a.access_mode || (f.mode === 'password' && !!f.password);
  const pwShort = f.mode === 'password' && f.password && f.password.length < 8;
  let reason = '';
  if (!changed) reason = 'Chưa đổi gì';
  else if (f.mode === 'password' && !f.password) reason = 'Đặt mật khẩu trước đã';
  else if (pwShort) reason = 'Mật khẩu cần ít nhất 8 ký tự.';
  return { changed, pwShort, reason, can: !reason && !d.busy };
}
function lkCheck(d, a) {
  const slug = d.slug.trim();
  const changed = slug !== (a.slug || '');
  const ok = /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug) && slug.length >= 6 && slug.length <= 64 && !slug.startsWith('f-');
  const taken = changed && S.artifacts.some((x) => x.id !== a.id && x.slug === slug && x.status !== 'removed');
  let reason = '';
  if (!changed) reason = 'Chưa đổi gì';
  else if (!slug) reason = 'Đường dẫn không được để trống';
  else if (!ok) reason = 'Đường dẫn phải dài 6–64 ký tự, chỉ gồm chữ thường, số và dấu gạch đơn; không bắt đầu bằng "f-".';
  else if (taken) reason = `Đường dẫn "${slug}" đã có artifact khác dùng.`;
  return { slug, changed, reason, can: changed && !reason };
}
function rpCheck(d, a) {
  const f = d.file;
  const used = usedBytes();
  const delta = f ? f.size - a.size_bytes : 0;
  const free = QUOTA_BYTES - used;
  const quotaIssue = f && delta > free ? `Đổi file này cần thêm ${fmtBytes(delta)} nhưng chỉ còn ${fmtBytes(free)}. Gỡ một nội dung khác xuống là đủ chỗ.` : '';
  const fileIssue = f && f.size > MAX_BYTES ? `File này ${fmtBytes(f.size)}, vượt mức ${fmtBytes(MAX_BYTES)}. Chọn file nhỏ hơn giúp nhé.` : '';
  return { quotaIssue, fileIssue, can: !!f && !quotaIssue && !fileIssue, pending: !!f };
}
function accessBody(d, a, inline) {
  const X = inline ? '' : `<button type="button" class="x" data-act="dlg-close" aria-label="Đóng">${I.x}</button>`;
  const closeAct = inline ? 'ac-reset' : 'dlg-close';
    const f = d.form;
    const { changed, pwShort, reason, can } = acCheck(d, a);
    const radio = (m) => `<button type="button" class="radio-card${f.mode === m ? ' on' : ''}" data-act="ac-mode" data-m="${m}" role="radio" aria-checked="${f.mode === m}"><span class="rd"></span><div><div class="t">${ACCESS_ICON[m]}${T.access[m].label}${m === a.access_mode ? ` <span class="badge gray" style="margin-left:4px">hiện tại</span>` : ''}</div><div class="d">${T.access[m].description}</div></div></button>`;
    if (d.phase === 'done') {
      return `${inline ? '' : `<h4>Đổi quyền xem</h4><div class="hr"></div>`}<div class="body">
        <div class="done-title">${I.checkc}<span>Quyền xem giờ là ${T.access[a.access_mode].label}. Mã QR và link ngắn không đổi.</span></div>
        ${d.password ? `<div class="field"><span class="label" style="color:var(--slate-600)">Mật khẩu</span><div class="input mono ro"><input readonly value="${esc(d.password)}" /><button type="button" class="ad" data-act="copy" data-text="${esc(d.password)}" data-msg="Đã sao chép mật khẩu" data-tip="Sao chép mật khẩu">${I.copy}</button></div><span class="hint">Đây là lần duy nhất mật khẩu hiện ra. Sao chép và gửi cho người cần xem.</span></div>` : ''}
        <div class="foot"><button type="button" class="btn default sm" data-act="${closeAct}">Xong</button></div>
      </div>`;
    }
    return `${inline ? '' : `${X}<h4>Đổi quyền xem</h4><div class="hr"></div>`}<div class="body" role="radiogroup">
      ${radio('public')}${radio('private')}${radio('password')}
      ${f.mode === 'password' ? `<div class="pwbox"><label class="label" for="ac-pw">${a.access_mode === 'password' ? 'Mật khẩu mới' : 'Mật khẩu'}</label><div class="row"><div class="input mono grow${pwShort ? ' bad' : ''}"><input id="ac-pw" type="${f.show ? 'text' : 'password'}" placeholder="Ít nhất 8 ký tự" value="${esc(f.password)}" data-act="ac-pw" autocomplete="new-password" /><button type="button" class="ad" data-act="ac-showpw" data-tip="${f.show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'}">${I.eye}</button></div><button type="button" class="btn secondary" data-act="ac-genpw">${I.refresh}Tạo ngẫu nhiên</button></div>${pwShort ? `<span class="err">Mật khẩu cần ít nhất 8 ký tự.</span>` : `<span class="hint">Người xem nhập mật khẩu này một lần rồi xem được trong một tuần.</span>`}</div>` : ''}
      ${radio('google')}
      ${a.access_mode === 'password' && f.mode !== 'password' ? `<div class="notice warning"><span class="ni">${I.warn}</span><div>Mọi người đang xem bằng mật khẩu cũ sẽ phải xác thực lại.</div></div>` : ''}
      <div class="notice info"><span class="ni">${I.info}</span><div><b>Mã QR và link ngắn không đổi</b>Đổi chế độ xem có hiệu lực ngay, không sinh link mới.</div></div>
      ${inline ? (reason && changed ? `<span class="err">${esc(reason)}</span>` : '') : `<div class="foot"><button type="button" class="btn tertiary sm" data-act="dlg-close">Huỷ</button><button type="button" class="btn default sm${d.busy ? ' busy' : ''}" ${can || d.busy ? '' : 'disabled'} data-act="ac-save" aria-describedby="ac-reason">${d.busy ? '<span class="spin"></span>Đang lưu…' : 'Lưu'}</button>${reason && changed ? `<span class="reason" id="ac-reason">${esc(reason)}</span>` : ''}</div>`}
    </div>`;
}

function replaceBody(d, a, inline) {
  const X = inline ? '' : `<button type="button" class="x" data-act="dlg-close" aria-label="Đóng">${I.x}</button>`;
  const closeAct = inline ? 'rp-reset' : 'dlg-close';
  const isDraft = a.status === 'draft';
  const url = shortUrl(a);
  const head = inline ? '' : `${d.phase === 'uploading' ? '' : X}<h4>Cập nhật nội dung</h4><p class="desc">Thay file của “${esc(a.name)}”.</p><div class="hr"></div>`;
  const f = d.file;
  const used = usedBytes();
  const after = used - a.size_bytes + (f ? f.size : 0);
  const delta = f ? f.size - a.size_bytes : 0;
  const free = QUOTA_BYTES - used;

  if (a.status === 'removed' || d.phase === 'gone') {
    return `${head}<div class="body"><div class="notice error"><span class="ni">${I.shieldx}</span><div><b>Nội dung này đã được gỡ</b>Có ai đó đã gỡ nó xuống trong lúc bạn đang mở hộp thoại này. Mã QR đã in giờ dẫn tới trang thông báo đã gỡ. Tạo một artifact mới nếu bạn cần đăng lại.</div></div><div class="foot"><button type="button" class="btn tertiary sm" data-act="${closeAct}">Đóng</button><button type="button" class="btn default sm" data-act="go" data-to="#/artifacts/new">Tạo artifact mới</button></div></div>`;
  }
  if (d.phase === 'uploading') {
    const sent = Math.round(f.size * d.progress / 100);
    return `${head}<div class="body">
      <div><div class="row hint" style="justify-content:space-between"><b style="color:var(--slate-600)">Đang tải lên</b><span>${d.progress}%</span></div><div class="qbar"><i style="width:${d.progress}%"></i></div><span class="hint">Đã gửi ${fmtBytes(sent)} / ${fmtBytes(f.size)}. ${isDraft ? 'Đóng tab lúc này thì không có gì hỏng — bản cũ vẫn còn, chỉ là chưa đổi.' : `Đóng tab lúc này thì ${esc(url.replace(/^https?:\/\//, ''))} vẫn mở ra bản cũ — không hỏng gì, chỉ là chưa đổi.`}</span></div>
      <div class="foot"><button type="button" class="btn tertiary sm" disabled>Huỷ</button><button type="button" class="btn default sm busy"><span class="spin"></span>Đang cập nhật…</button></div></div>`;
  }
  if (d.phase === 'done') {
    return `${inline ? '' : `${X}<h4>Cập nhật nội dung</h4><div class="hr"></div>`}<div class="body">
      <div class="done-title">${I.checkc}<span>Đã thay nội dung</span></div>
      <div class="notice neutral"><span class="ni">${I.info}</span><div><b>Đã đổi</b>${isDraft ? `Nội dung giờ là ${esc(a.file_name)} (${fmtBytes(a.size_bytes)}).` : `${esc(url.replace(/^https?:\/\//, ''))} giờ mở ra ${esc(a.file_name)} (${fmtBytes(a.size_bytes)}).`} Dung lượng còn dùng: ${fmtBytes(usedBytes())} / ${fmtBytes(QUOTA_BYTES)}.</div></div>
      <div class="notice success"><span class="ni">${I.checkc}</span><div><b>Không đổi</b>${isDraft ? 'Tên và trạng thái chưa xuất bản. Link và mã QR sẽ có khi bạn xuất bản.' : 'Mã QR, link ngắn và lượt quét đã ghi. Standee và tờ rơi đã in vẫn mở ra bản mới.'}</div></div>
      <div class="foot">${isDraft ? '' : `<button type="button" class="btn secondary sm" data-act="open-public" data-token="${a.token}">Mở link kiểm tra</button>`}<button type="button" class="btn default sm" data-act="${closeAct}">Xong</button></div></div>`;
  }
  // phase select
  const { quotaIssue, fileIssue, can } = rpCheck(d, a);
  const kindChange = f && f.kind !== a.kind;
  return `${head}<div class="body">
    ${f ? `<div class="dropzone has${fileIssue ? ' bad' : ''}" style="padding:20px"><span class="cloud">${KIND_ICON[f.kind]}</span><span class="t">${esc(f.name)} · ${fmtBytes(f.size)}</span><span class="badge gray">${T.kind[f.kind]}</span><button type="button" class="link" data-act="rp-clear">Chọn file khác</button></div>${fileIssue ? `<span class="err" style="margin-top:-12px">${fileIssue}</span>` : ''}`
        : `<div class="dropzone" style="padding:24px" data-act="rp-sample" data-i="2"><span class="cloud">${I.upload}</span><span class="t">Thả file vào đây hoặc bấm để chọn</span><span class="hint">HTML, PDF, PowerPoint hoặc video — tối đa ${fmtBytes(MAX_BYTES)}</span><div class="samples" data-stop><span class="hint" style="align-self:center">Prototype · dùng file mẫu:</span>${SAMPLE_FILES.map((s, i) => `<button type="button" class="btn secondary xs" data-act="rp-sample" data-i="${i}">${KIND_ICON[s.kind]}${esc(s.name)}</button>`).join('')}<button type="button" class="btn secondary xs" data-act="rp-sample" data-i="big">${I.video}video-12mb.mp4 (quá cỡ)</button></div></div>`}
    ${f && f.kind === 'slides' ? `<span class="hint" style="margin-top:-12px">File PowerPoint được Microsoft tải về để hiển thị bản xem trước.</span>` : ''}
    ${f ? `<div class="diff">
      <div class="r"><span class="l">Đang phục vụ</span><span class="truncate">${esc(a.name)}</span><span class="badge gray">${T.kind[a.kind]}</span><span class="hint">${fmtBytes(a.size_bytes)}</span></div>
      <div class="r"><span class="l">Sẽ thay bằng</span><span class="truncate">${esc(f.name)}</span><span class="badge gray">${T.kind[f.kind]}</span><span class="hint">${fmtBytes(f.size)}</span></div>
    </div>` : ''}
    ${kindChange ? `<div class="notice warning"><span class="ni">${I.warn}</span><div><b>Loại nội dung đổi từ ${T.kind[a.kind]} sang ${T.kind[f.kind]}</b>${isDraft ? `Khi xuất bản, người quét sẽ thấy ${T.viewer[f.kind]}.` : `Người quét sẽ thấy ${T.viewer[f.kind]} thay vì ${T.viewer[a.kind]} như trước. Mã QR và link ngắn vẫn giữ nguyên.`}</div></div>` : ''}
    ${f ? `<div>
      <div class="row hint" style="justify-content:space-between"><b style="color:var(--slate-600)">Dung lượng sau khi đổi</b><span>${fmtBytes(used)} → ${fmtBytes(after)} / ${fmtBytes(QUOTA_BYTES)}</span></div>
      <div class="qbar"><i style="width:${Math.min(100, (used - a.size_bytes) / QUOTA_BYTES * 100)}%"></i><i class="add" style="left:${Math.min(100, (used - a.size_bytes) / QUOTA_BYTES * 100)}%;width:${Math.min(100, f.size / QUOTA_BYTES * 100)}%;background:${quotaIssue ? 'var(--semantic-error)' : ''}"></i></div>
      ${quotaIssue ? `<span class="err">${quotaIssue} <button type="button" class="short" style="font-size:inherit" data-act="go" data-to="#/artifacts">Xem nội dung đang chiếm chỗ</button></span>`
        : `<span class="hint">${delta > 0 ? `File mới nặng hơn file cũ ${fmtBytes(delta)} — chỉ phần chênh đó tính thêm.` : delta < 0 ? `File mới nhẹ hơn file cũ ${fmtBytes(-delta)} — phần chênh đó được trả lại.` : 'File mới nặng bằng file cũ — dung lượng không đổi.'} Số nội dung đã xuất bản không đổi: vẫn ${liveCount()} / ${QUOTA_LIVE}. Còn trống ${fmtBytes(QUOTA_BYTES - after)}.</span>`}
    </div>` : ''}
    ${inline && !f ? '' : isDraft ? `<div class="notice neutral"><span class="ni">${I.info}</span><div><b>Chưa xuất bản nên chưa có link hay mã QR</b>Thay file lúc này không ảnh hưởng gì ở bên ngoài.</div></div>`
              : `<div class="notice success"><span class="ni">${I.checkc}</span><div><b>Mã QR và link ngắn giữ nguyên</b>Standee, tờ rơi và bao bì đã in vẫn mở ra nội dung mới. Lượt quét đã ghi vẫn còn.</div></div>`}
    ${inline && !f ? '' : `<div class="notice neutral"><span class="ni">${I.info}</span><div><b>File cũ bị thay hẳn</b>Sau khi bấm Cập nhật, ${esc(a.name)} không lấy lại được. Nếu còn cần, tải nó về trước.<br><button type="button" class="lnk" data-act="toast" data-msg="Đang tải ${esc(a.file_name)}…">${I.download}Tải bản đang chạy về</button></div></div>`}
    ${inline ? '' : `<div class="foot"><button type="button" class="btn tertiary sm" data-act="dlg-close">Huỷ</button><button type="button" class="btn default sm" ${can ? '' : 'disabled'} data-act="rp-submit" aria-describedby="rp-reason">Cập nhật</button>${!f ? `<span class="reason" id="rp-reason">Chọn một file trước đã</span>` : ''}</div>`}
  </div>`;
}

/* ===================================================== PUBLIC /a/<token> */
function gateState(token) { if (!S.gate[token]) S.gate[token] = { tries: 0, lockedUntil: 0, unlocked: false, signedIn: null, wrong: false, pwChanged: false }; return S.gate[token]; }
function publicScreen(token) {
  const a = byToken(token);
  const dark = S.dark;
  const shellCls = `pub${dark ? ' dark-shell' : ''}`;
  const brand = `<div class="brand">${I.qr}<span>li2</span></div>`;
  const foot = `<p class="foot">${T.landing.removed_footer} <a href="#/artifacts" data-act="go" data-to="#/artifacts">Li2</a></p>`;
  const page = (inner, http) => `<div class="${shellCls}"><span class="httptag">HTTP ${http} · /a/${esc(token)}</span><div class="wrap">${brand}${inner}${foot}</div></div>`;

  if (!a) return page(`<svg class="gicon ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg><h1>Không tìm thấy</h1><p class="lead">Đường dẫn này không tồn tại.</p>`, 404);
  if (a.status === 'removed') return page(`<svg class="gicon ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/></svg><h1>${T.landing.removed_title}</h1><p class="lead">${T.landing.removed_body}</p><div class="reassure"><b>${T.landing.removed_reassure_strong}</b> ${T.landing.removed_reassure_body}</div>`, 410);
  if (a.status !== 'live') return page(`<h1>Không tìm thấy</h1><p class="lead">Đường dẫn này chưa được xuất bản.</p>`, 404);

  const g = gateState(token);
  const content = () => {
    if (a.kind === 'html') return `<div class="${shellCls}"><span class="httptag">HTTP 200 · /a/${esc(token)} · HTML sandbox</span><div class="fullhtml"><iframe sandbox="" title="${esc(a.name)}" srcdoc="${srcdoc(demoHtml(a))}"></iframe></div></div>`;
    return page(`<h1>${esc(a.name)}</h1><div class="viewer">${a.kind === 'pdf' ? 'PDF viewer của trình duyệt' : a.kind === 'video' ? '▶ video · poster' : 'Office viewer'}</div><span class="dl">${T.landing.download}</span><p class="note">Không hiện ở đây? Mở trong tab mới.</p>`, 200);
  };

  if (a.access_mode === 'public' || g.unlocked) return content();

  if (a.access_mode === 'password') {
    if (g.lockedUntil > Date.now()) {
      const m = Math.max(1, Math.ceil((g.lockedUntil - Date.now()) / 60000));
      return page(`<svg class="gicon ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><h1>${T.landing.gate_locked_title}</h1><p class="lead">${T.landing.gate_locked_lead.replace('{m}', m)}</p><p class="note"><button type="button" class="gbtn" style="margin-top:8px" data-act="gate-unlock-demo" data-token="${token}">Prototype: giả lập đã hết ${GATE_LOCK_MINUTES} phút</button></p>`, 429);
    }
    const left = GATE_MAX_TRIES - g.tries;
    return page(`<svg class="gicon ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><h1>${T.landing.gate_password_title}</h1><p class="lead">${T.landing.gate_password_lead}</p>
      <form data-act="gate-pw" data-token="${token}" method="post" action="#">
        <label for="g-pw">${T.landing.gate_password_label}</label>
        <input id="g-pw" class="gin${g.wrong ? ' bad' : ''}" type="password" name="password" autocomplete="current-password" autofocus />
        ${g.wrong ? `<p class="gerr">${T.landing.gate_password_wrong.replace('{n}', left)}</p>` : ''}
        ${g.pwChanged ? `<p class="ghint">${T.landing.gate_password_changed}</p>` : ''}
        <button type="submit" class="gbtn">${T.landing.gate_password_submit}</button>
      </form>
      <p class="note">Prototype: mật khẩu đúng là <code>${esc(a.password)}</code> (xem ở tab Quyền xem của chủ sở hữu).</p>`, 401);
  }
  if (a.access_mode === 'private') {
    if (!g.signedIn) return page(`<svg class="gicon ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><h1>${T.landing.gate_private_title}</h1><p class="lead">${T.landing.gate_private_lead}</p><button type="button" class="gbtn li2" data-act="gate-login" data-token="${token}" data-as="outsider">${T.landing.gate_private_button}</button><p class="note">Prototype: lần đầu đăng nhập bằng tài khoản ngoài org để thấy 403.</p>`, 401);
    return page(`<svg class="gicon ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m14.5 9.5-5 5M9.5 9.5l5 5"/></svg><h1>${T.landing.denied_title}</h1><p class="gemail">${T.landing.denied_signed_in_as.replace('{email}', esc(g.signedIn))}</p><p class="lead">${T.landing.denied_lead}</p><form data-act="gate-switch" data-token="${token}" method="post" action="#"><button type="submit" class="gbtn">${T.landing.denied_switch_button}</button></form><p class="note">Prototype: đổi tài khoản sẽ đăng nhập thành thành viên ${ORG}.</p>`, 403);
  }
  if (a.access_mode === 'google') {
    return page(`<svg class="gicon ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><h1>${T.landing.gate_google_title}</h1><p class="lead">${T.landing.gate_google_lead}</p>${g.cancelled ? `<p class="ghint">Bạn đã dừng việc đăng nhập. Nội dung này chỉ xem được sau khi đăng nhập.</p>` : ''}<button type="button" class="gbtn google" data-act="gate-google" data-token="${token}">${I.google}${T.landing.gate_google_button}</button><p class="note"><button type="button" style="text-decoration:underline" data-act="gate-google-cancel" data-token="${token}">Prototype: giả lập huỷ ở Google</button></p>`, 401);
  }
  return content();
}

/* ===================================================== RENDER */
function render() {
  const r = parseHash();
  const scroller = document.querySelector('.pagebody');
  const scrollY = scroller ? scroller.scrollTop : 0;
  const app = document.getElementById('app');
  const pub = document.getElementById('pub');
  const layer = document.getElementById('layer');
  let label = '';
  if (r.name === 'public') {
    app.hidden = true; pub.hidden = false;
    pub.innerHTML = publicScreen(r.token);
    const a = byToken(r.token);
    label = `/a/${r.token} · ${a ? (a.status === 'removed' ? '410' : a.access_mode) : '404'}`;
  } else {
    pub.hidden = true; app.hidden = false;
    let inner = '';
    if (r.name === 'list') { inner = listScreen(); label = 'Danh sách'; }
    else if (r.name === 'create') { inner = createScreen(); label = 'Tạo artifact'; }
    else { inner = detailScreen(r.id, r.tab); label = `Chi tiết · ${r.tab}`; }
    app.innerHTML = shell(r, inner);
    if (r.name !== 'create') S.create = null;
  }
  layer.innerHTML = dialogHtml();
  document.getElementById('pb-screen').textContent = label;
  document.getElementById('pb-theme').textContent = S.dark ? 'light' : 'dark';
  document.getElementById('pb-empty').textContent = S.emptyDemo ? 'Thoát trạng thái rỗng' : 'Xem trạng thái rỗng';
  const af = document.querySelector('[autofocus]'); if (af) af.focus({ preventScroll: true });
  const nowScroller = document.querySelector('.pagebody');
  if (nowScroller) nowScroller.scrollTop = r.name + ':' + (r.id || r.token || '') === S.lastRoute ? scrollY : 0;
  S.lastRoute = r.name + ':' + (r.id || r.token || '');
}

/* ===================================================== ACTIONS */
function openDialog(d) { S.dialog = d; S.menu = null; render(); }
function closeDialog() {
  const d = S.dialog; S.dialog = null;
  if (d && d.type === 'created') { go(`#/artifacts/${d.id}`); return; }
  render();
}
function publish(a, password) {
  a.status = 'live'; a.token = a.token || randToken(); a.published_at = Date.now(); a.updated_at = Date.now();
  if (a.access_mode === 'password') { a.password = password || a.password || randPw(); a.password_set_at = Date.now(); }
  return a;
}
function doCreateSubmit() {
  const c = S.create; if (!c || c.busy) return;
  c.busy = true; c.progress = 0; render();
  const tick = () => {
    c.progress = Math.min(100, c.progress + 9 + Math.round(Math.random() * 14));
    if (c.progress < 100) { render(); setTimeout(tick, 120); return; }
    const id = 'a' + (S.artifacts.length + 1 + Math.floor(Math.random() * 1000));
    const a = { id, name: c.name.trim(), kind: c.file.kind, status: 'draft', access_mode: c.access, slug: c.slug, token: null, file_name: c.file.name, size_bytes: c.file.size, created_at: Date.now(), updated_at: Date.now(), published_at: null, visits: 0, viewers: 0, creator: 'KQ' };
    publish(a, c.password);
    S.artifacts.unshift(a);
    S.create = null; S.page = 1;
    S.dialog = { type: 'created', id, password: a.access_mode === 'password' ? a.password : null };
    toast('Đã xuất bản');
    render();
  };
  setTimeout(tick, 150);
}

document.addEventListener('click', (e) => {
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-act]');
  if (!el) { if (!stop && S.menu) { S.menu = null; render(); } return; }
  const act = el.dataset.act;
  // bấm vào vùng bên trong row (có data-stop) không mở detail
  if (act === 'open-detail' && stop && stop !== el) return;
  const id = el.dataset.id;
  switch (act) {
    case 'nav': if (el.dataset.to) go(el.dataset.to); else toast('Prototype: chỉ có màn Artifact'); break;
    case 'go': go(el.dataset.to); break;
    case 'toggle-theme': S.dark = !S.dark; document.documentElement.classList.toggle('dark', S.dark); render(); break;
    case 'toggle-empty': S.emptyDemo = !S.emptyDemo; S.selected.clear(); go('#/artifacts'); render(); break;
    case 'reset': { const dark = S.dark; reset(); S.dark = dark; location.hash = '#/artifacts'; render(); toast('Đã đặt lại dữ liệu mẫu'); break; }
    case 'copy': copyText(el.dataset.text, el.dataset.msg || 'Đã sao chép link'); break;
    case 'toast': toast(el.dataset.msg); break;
    case 'open-public': go(`#/a/${el.dataset.token}`); break;
    case 'open-detail': { const a = byId(id); if (a && a.status === 'removed') { toast('Artifact đã gỡ, không còn trang chi tiết. Link và QR đã in vẫn dẫn tới trang thông báo đã gỡ.'); break; } go(`#/artifacts/${id}`); break; }
    case 'sel': if (S.selected.has(id)) S.selected.delete(id); else S.selected.add(id); render(); break;
    case 'sel-all': { const rows = visibleArtifacts().slice((S.page - 1) * S.pageSize, S.page * S.pageSize); const all = rows.every((a) => S.selected.has(a.id)); rows.forEach((a) => all ? S.selected.delete(a.id) : S.selected.add(a.id)); render(); break; }
    case 'page': { const p = +el.dataset.p; if (p >= 1) { S.page = p; render(); } break; }
    case 'menu': S.menu = S.menu && S.menu.id === id ? null : { id }; render(); break;
    case 'menu-detail': S.menu = S.menu && S.menu.kind === 'detail' ? null : { kind: 'detail' }; render(); break;
    case 'dl-qr': toast('Đang tải QR (PNG 1024px)…'); S.menu = null; render(); break;
    case 'dlg-close': closeDialog(); break;
    case 'overlay-close': if (e.target === el && !(S.dialog && (S.dialog.busy || S.dialog.phase === 'uploading'))) closeDialog(); break;
    case 'dlg-delete': openDialog({ type: 'delete', id }); break;
    case 'bulk-delete': openDialog({ type: 'delete', ids: [...S.selected] }); break;
    case 'delete-confirm': { const d = S.dialog; d.busy = true; render(); setTimeout(() => { const ids = d.ids || [d.id]; ids.forEach((x) => { const a = byId(x); if (a) { a.status = 'removed'; a.size_bytes = 0; a.updated_at = Date.now(); } }); S.selected.clear(); S.dialog = null; toast(ids.length > 1 ? `Đã xoá ${ids.length} artifact.` : 'Đã xoá artifact.'); go('#/artifacts'); render(); }, 600); break; }
    case 'dlg-share': openDialog({ type: 'share', id }); break;
    case 'dlg-replace': openDialog({ type: 'replace', id, phase: 'select', file: null }); break;
    case 'rp-sample': { const i = el.dataset.i; rpState().file = i === 'big' ? { name: 'video-12mb.mp4', kind: 'video', size: 12 * 1024 * 1024 } : { ...SAMPLE_FILES[+i] }; render(); break; }
    case 'rp-clear': rpState().file = null; render(); break;
    case 'rp-reset': S.rp = null; render(); break;
    case 'scroll-to': { const t = document.getElementById(el.dataset.to); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'rp-submit': { const d = rpState(); d.phase = 'uploading'; d.progress = 0; render(); const tick = () => { d.progress = Math.min(100, d.progress + 8 + Math.round(Math.random() * 12)); if (d.progress < 100) { render(); setTimeout(tick, 140); return; } const a = byId(d.id); a.kind = d.file.kind; a.file_name = d.file.name; a.size_bytes = d.file.size; a.updated_at = Date.now(); d.phase = 'done'; render(); }; setTimeout(tick, 150); break; }
    case 'dlg-access': { const a = byId(id); openDialog({ type: 'access', id, phase: 'edit', form: { mode: a.access_mode, password: '', show: false } }); break; }
    case 'ac-mode': acState().form.mode = el.dataset.m; render(); break;
    case 'ac-reset': S.ac = null; render(); break;
    case 'set-public': { const a = byId(id); if (!a || a.access_mode === 'public') break; a.access_mode = 'public'; a.updated_at = Date.now(); if (a.token) { const g = gateState(a.token); g.unlocked = false; g.tries = 0; g.wrong = false; } if (S.ac && S.ac.id === a.id) S.ac = null; S.menu = null; toast(`${a.name}: ai có link đều xem được. Mã QR và link ngắn không đổi.`); render(); break; }
    case 'apply-all': {
      const a = byId(id); if (!a || S.applying) break;
      const rp = S.rp && S.rp.id === a.id && S.rp.phase === 'select' ? S.rp : null;
      const ac = S.ac && S.ac.id === a.id && S.ac.phase === 'edit' ? S.ac : null;
      const rpc = rp ? rpCheck(rp, a) : { pending: false, can: false };
      const acc = ac ? acCheck(ac, a) : { changed: false, can: false };
      const lkc = S.lk && S.lk.id === a.id ? lkCheck(S.lk, a) : { changed: false, can: false };
      if (!rpc.pending && !acc.changed && !lkc.changed) { const t = document.getElementById('sec-replace'); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); toast('Chọn file mới hoặc đổi quyền xem bên dưới, rồi bấm Cập nhật nội dung.'); break; }
      if (rpc.pending && !rpc.can) { toast(rpc.fileIssue || rpc.quotaIssue, 'err'); break; }
      if (acc.changed && !acc.can) { toast(acc.reason, 'err'); break; }
      if (lkc.changed && !lkc.can) { toast(lkc.reason, 'err'); break; }
      S.applying = true;
      const finish = () => { S.applying = false; const parts = []; if (rpc.pending) parts.push('nội dung'); if (acc.changed) parts.push(`quyền xem (${T.access[a.access_mode].label})`); if (lkc.changed) { a.slug = lkc.slug; a.updated_at = Date.now(); S.lk = null; parts.push(`đường dẫn (${DOMAIN}/${lkc.slug})`); } toast(`Đã cập nhật ${parts.join(', ')}. ${lkc.changed ? 'Mã QR sinh lại theo đường dẫn mới; đường dẫn cũ vẫn chuyển hướng.' : 'Mã QR và link ngắn không đổi.'}`); render(); };
      const doAccess = () => { if (acc.changed) applyAccess(ac, a, finish); else finish(); };
      if (rpc.pending) { rp.phase = 'uploading'; rp.progress = 0; render(); const tick = () => { rp.progress = Math.min(100, rp.progress + 8 + Math.round(Math.random() * 12)); if (rp.progress < 100) { render(); setTimeout(tick, 140); return; } a.kind = rp.file.kind; a.file_name = rp.file.name; a.size_bytes = rp.file.size; a.updated_at = Date.now(); rp.phase = 'done'; doAccess(); }; setTimeout(tick, 150); }
      else { render(); setTimeout(doAccess, 600); }
      break;
    }
    case 'ac-genpw': { const d = acState(); d.form.password = randPw(); d.form.show = true; render(); break; }
    case 'ac-showpw': { const d = acState(); d.form.show = !d.form.show; render(); break; }
    case 'ac-save': { const d = acState(); const inline = d === S.ac; d.busy = true; render(); setTimeout(() => { const a = byId(d.id); const f = d.form; const was = a.access_mode; a.access_mode = f.mode; a.updated_at = Date.now(); if (f.mode === 'password') { a.password = f.password; a.password_set_at = Date.now(); Object.values(S.gate).forEach((g) => { g.unlocked = false; g.tries = 0; g.wrong = false; g.pwChanged = was === 'password'; }); d.phase = 'done'; d.password = f.password; d.busy = false; render(); } else { if (a.token) { const g = gateState(a.token); g.unlocked = false; g.tries = 0; g.wrong = false; } if (inline) S.ac = null; else S.dialog = null; toast(`Quyền xem giờ là ${T.access[f.mode].label}. Mã QR và link ngắn không đổi.`); render(); } }, 600); break; }
    case 'dlg-password': openDialog({ type: 'password', id, phase: 'edit', form: { password: '', show: false } }); break;
    case 'pw-genpw': S.dialog.form.password = randPw(); S.dialog.form.show = true; render(); break;
    case 'pw-showpw': S.dialog.form.show = !S.dialog.form.show; render(); break;
    case 'pw-save': { const d = S.dialog; d.busy = true; render(); setTimeout(() => { const a = byId(d.id); a.password = d.form.password; a.password_set_at = Date.now(); a.updated_at = Date.now(); if (a.token) { const g = gateState(a.token); g.unlocked = false; g.tries = 0; g.wrong = false; g.pwChanged = true; } d.phase = 'done'; d.password = d.form.password; d.busy = false; render(); }, 600); break; }
    case 'publish-draft': { const a = byId(id); if (liveCount() >= QUOTA_LIVE) { toast(`Bạn đang có ${QUOTA_LIVE} artifact đã xuất bản, là mức tối đa. Gỡ bớt một cái rồi thử lại.`, 'err'); break; } publish(a); openDialog({ type: 'created', id, password: a.access_mode === 'password' ? a.password : null }); break; }
    // create
    case 'c-sample': { if (stop && stop !== el && el.classList.contains('dropzone')) break; const f = { ...SAMPLE_FILES[+el.dataset.i] }; const c = S.create; c.file = f; if (!c.name) c.name = f.name.replace(/\.[^.]+$/, '').replace(/-/g, ' ').replace(/^./, (ch) => ch.toUpperCase()); if (!c.slugTouched) c.slug = slugify(c.name); render(); break; }
    case 'c-clear-file': S.create.file = null; render(); break;
    case 'c-access': S.create.access = el.dataset.m; render(); break;
    case 'c-genpw': S.create.password = randPw(); S.create.showPw = true; render(); break;
    case 'c-showpw': S.create.showPw = !S.create.showPw; render(); break;
    case 'c-submit': doCreateSubmit(); break;
    // gate
    case 'gate-login': gateState(el.dataset.token).signedIn = 'ban@congty-khac.vn'; render(); break;
    case 'gate-google': { const g = gateState(el.dataset.token); g.unlocked = true; g.cancelled = false; const a = byToken(el.dataset.token); if (a) a.viewers += 1; render(); break; }
    case 'gate-google-cancel': gateState(el.dataset.token).cancelled = true; render(); break;
    case 'gate-unlock-demo': { const g = gateState(el.dataset.token); g.lockedUntil = 0; g.tries = 0; g.wrong = false; render(); break; }
  }
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const v = el.value;
  switch (el.dataset.act) {
    case 'search': S.search = v; S.page = 1; rerenderKeepFocus(el); break;
    case 'c-name': S.create.name = v; if (!S.create.slugTouched) S.create.slug = slugify(v); rerenderKeepFocus(el); break;
    case 'c-slug': S.create.slug = v; S.create.slugTouched = true; rerenderKeepFocus(el); break;
    case 'lk-slug': if (S.lk) { S.lk.slug = v; rerenderKeepFocus(el); } break;
    case 'c-pw': S.create.password = v; rerenderKeepFocus(el); break;
    case 'ac-pw': acState().form.password = v; rerenderKeepFocus(el); break;
    case 'pw-input': S.dialog.form.password = v; rerenderKeepFocus(el); break;
  }
});
function pendingCount(a) {
  let n = 0;
  if (S.rp && S.rp.id === a.id && S.rp.phase === 'select' && rpCheck(S.rp, a).pending) n++;
  if (S.ac && S.ac.id === a.id && S.ac.phase === 'edit' && acCheck(S.ac, a).changed) n++;
  if (S.lk && S.lk.id === a.id && lkCheck(S.lk, a).changed) n++;
  return n;
}
function pendingTip(a) {
  const parts = [];
  if (S.rp && S.rp.id === a.id && S.rp.phase === 'select' && rpCheck(S.rp, a).pending) parts.push('thay file');
  if (S.ac && S.ac.id === a.id && S.ac.phase === 'edit' && acCheck(S.ac, a).changed) parts.push('đổi quyền xem');
  if (S.lk && S.lk.id === a.id && lkCheck(S.lk, a).changed) parts.push('đổi đường dẫn');
  return parts.length ? `Áp dụng: ${parts.join(' + ')}` : 'Chọn file hoặc đổi quyền xem bên dưới rồi bấm nút này';
}
function applyAccess(d, a, done) {
  const f = d.form; const was = a.access_mode;
  a.access_mode = f.mode; a.updated_at = Date.now();
  if (f.mode === 'password') {
    a.password = f.password; a.password_set_at = Date.now();
    Object.values(S.gate).forEach((g) => { g.unlocked = false; g.tries = 0; g.wrong = false; g.pwChanged = was === 'password'; });
    d.phase = 'done'; d.password = f.password; d.busy = false;
  } else {
    if (a.token) { const g = gateState(a.token); g.unlocked = false; g.tries = 0; g.wrong = false; }
    d.phase = 'edit'; d.form = { mode: a.access_mode, password: '', show: false }; d.busy = false;
  }
  done && done();
}
function acState() { return S.dialog && S.dialog.type === 'access' ? S.dialog : S.ac; }
function rpState() { return S.dialog && S.dialog.type === 'replace' ? S.dialog : S.rp; }
function rerenderKeepFocus(el) {
  const id = el.id, act = el.dataset.act, pos = el.selectionStart;
  render();
  const n = id ? document.getElementById(id) : document.querySelector(`[data-act="${act}"]`);
  if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} }
}
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-act]'); if (!f) return;
  e.preventDefault();
  const token = f.dataset.token; const a = byToken(token); const g = gateState(token);
  if (f.dataset.act === 'gate-pw') {
    const val = f.querySelector('input[name=password]').value;
    if (val === a.password) { g.unlocked = true; g.tries = 0; g.wrong = false; g.pwChanged = false; render(); return; }
    g.tries += 1; g.wrong = true; g.pwChanged = false;
    if (g.tries >= GATE_MAX_TRIES) { g.lockedUntil = Date.now() + GATE_LOCK_MINUTES * 60000; g.tries = 0; g.wrong = false; }
    render();
  }
  if (f.dataset.act === 'gate-switch') { g.signedIn = 'khanh.qn@gmail.com'; g.unlocked = true; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.dialog && !(S.dialog.busy || S.dialog.phase === 'uploading')) closeDialog(); else if (S.menu) { S.menu = null; render(); } } });

render();
})();
</script>
