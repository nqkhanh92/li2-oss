# clamd.conf cho LiHi — chép đúng 6 dòng hiệu lực của ảnh clamav/clamav:1.4
# (đo 2026-10-21: `grep -v "^#\|^$" /etc/clamav/clamd.conf` ra đúng chừng này),
# cộng hai cờ heuristic bật thêm ở cuối. Mọi directive khác giữ mặc định của clamd.
#
# ⚠️ File này THAY THẾ hoàn toàn conf trong ảnh khi được mount. Nếu ảnh nâng version và
# đổi mặc định, phải so lại: `docker exec lihi-clamav grep -v "^#\|^$" /etc/clamav/clamd.conf.sample`.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# ── Hai cờ bật thêm (quyết định 2026-10-21) ────────────────────────────────────────────────────
# Một file nén hoặc tài liệu có mật khẩu là nội dung KHÔNG quét được. Artifact được phục vụ công
# khai sau một đường link, nên "không biết bên trong có gì" ở đây không phải trạng thái trung tính:
# nó là cách rẻ nhất để đưa payload qua một máy quét. Hai cờ này biến "không đọc được" thành
# Heuristics.Encrypted.* và lớp fail-closed trong artifact.service.ts sẽ từ chối upload.
#
# Giá phải trả, nói rõ để sau không ai ngạc nhiên: PDF bảo vệ bằng mật khẩu là hợp lệ và phổ biến;
# khách tải lên một PDF như vậy sẽ bị từ chối với câu "có mã độc", KHÔNG phải câu đúng. Nếu khách
# than phiền, hai lựa chọn: tắt AlertEncryptedDoc, hoặc tách một câu lỗi riêng cho họ
# Heuristics.Encrypted (cần đọc signature trong clamav-client.ts — nó đã trả về tên signature).
#
# AlertOLE2Macros CỐ Ý KHÔNG bật: nó chặn mọi macro, kể cả hợp lệ, và hiện chưa có đường kháng nghị.
AlertEncryptedArchive yes
AlertEncryptedDoc yes
