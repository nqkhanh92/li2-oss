# Cổng API của Supabase — chỉ hai tuyến, vì Li2 chỉ gọi hai thứ.
#
# Bản kong.yml chính thức của Supabase có thêm các tuyến /auth/v1, /realtime/v1, /functions/v1,
# /pg/ và dashboard. Li2 không gọi cái nào trong số đó (xem phần giải thích ở docker-compose.yml),
# nên để lại chỉ là thêm bề mặt tấn công.
#
# ⚠ Hai chỗ dấu-đô-la-ngoặc dưới KHÔNG phải cú pháp của Kong — Kong không tự thay biến môi
# trường. `docker-compose.yml` chạy một bước `sed` thay chúng rồi mới đưa file cho Kong, nên
# khoá không nằm trong repo.

_format_version: '2.1'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${SUPABASE_ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SUPABASE_SERVICE_KEY}

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  - name: storage-v1
    _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
