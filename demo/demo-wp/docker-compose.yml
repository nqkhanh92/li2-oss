networks:
  devnet:
    external: true

services:
  db:
    image: mysql:8.0
    container_name: demo-wp-db
    restart: unless-stopped
    env_file: .env
    environment:
      - MYSQL_DATABASE=wordpress
    volumes:
      - dbdata:/var/lib/mysql
    command: '--default-authentication-plugin=mysql_native_password'
    networks:
      - devnet

  wordpress:
    depends_on:
      - db
    image: wordpress:latest # Using the default Apache image so Traefik can route HTTP traffic directly
    container_name: demo-wp-wordpress
    restart: unless-stopped
    env_file: .env
    environment:
      - WORDPRESS_DB_HOST=db:3306
      - WORDPRESS_DB_USER=$MYSQL_USER
      - WORDPRESS_DB_PASSWORD=$MYSQL_PASSWORD
      - WORDPRESS_DB_NAME=wordpress
    volumes:
      - ./wordpress:/var/www/html
    expose:
      - 80
    networks:
      - devnet
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=devnet"
      - "traefik.http.routers.demo-wp.rule=Host(`demo-wp.li2.ai`)"
      - "traefik.http.routers.demo-wp.entrypoints=websecure"
      - "traefik.http.routers.demo-wp.tls=true"
      - "traefik.http.routers.demo-wp.tls.certresolver=letsencrypt"
      - "traefik.http.services.demo-wp.loadbalancer.server.port=80"

volumes:
  dbdata:
