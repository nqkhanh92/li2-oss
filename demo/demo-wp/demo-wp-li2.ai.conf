# Nginx Configuration Example for Host Nginx
# Add this file to your root Nginx (e.g., in /etc/nginx/sites-available/ or /etc/nginx/conf.d/)

server {
    listen 80;
    listen [::]:80;
    server_name demo-wp.li2.ai www.demo-wp.li2.ai; # Replace with your actual domain

    index index.php index.html index.htm;
    
    # This MUST point to the absolute path of the wordpress volume mapped in docker-compose.yml
    root /home/trungbmt/repositories/li2/quik_proximity_marketing/demo/demo-wp/wordpress;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Forward PHP requests to the WordPress FPM container exposed on port 9000
        fastcgi_pass 127.0.0.1:9000;
        
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }

    location = /favicon.ico {
        log_not_found off; access_log off;
    }

    location = /robots.txt {
        log_not_found off; access_log off; allow all;
    }

    location ~* \.(css|gif|ico|jpeg|jpg|js|png)$ {
        expires max;
        log_not_found off;
    }
}
