server {
    server_name test.li2.ai;
    
    # Proxy root path to localhost:3000
    location ~ ^/auth {
        return 301 https://app.li2.ai$request_uri;
    }
    # Proxy root, contact, lang, and images to localhost:3000
    location ~ ^/(contact|lang.*|images.*)?$ {
        proxy_pass http://localhost:3000/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    } 
    # Allow all under /kb (including /kb, /kb/, /kb/docs, etc.)
    location ^~ /kb {
        proxy_pass http://localhost:3000/kb;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Proxy all _next resources to localhost:3000
    location ~ ^/_next/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }  
    # All other paths go to your existing backend
    location / {
        # Forward the User-Agent as X-User-Agent
        proxy_set_header User-Agent $http_user_agent;
        # proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8099;
        proxy_intercept_errors on;
        error_page 502 503 504 = /maintenance.html; 
    }
    
    location /admin {
        allow 171.249.144.123;
        deny all;
        proxy_pass http://127.0.0.1:8099/admin;
    }
    
    location = /maintenance.html {
        root /usr/share/nginx/html;
    }
    
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/test.li2.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/test.li2.ai/privkey.pem; # managed by Certbot
}

server {
    if ($host = li2.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name test.li2.ai;
    return 404; # managed by Certbot
}