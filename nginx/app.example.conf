server {
    listen 443 ssl;
    server_name app.li2.ai;
    large_client_header_buffers 4 16k;
    # Artifact uploads are 10MB files, and multipart adds ~265 bytes. nginx's default is 1MB, so
    # without this line every upload over 1MB gets a 413 from nginx that the app never sees — no log
    # of ours, no test that could catch it. 12m leaves room for the multipart wrapper and for the
    # odd extra form field. This file is a sample: production goes through its own proxy, which has
    # to be checked separately.
    client_max_body_size 12m;
    access_log  /var/log/nginx/proximi_access.log;
    error_log  /var/log/nginx/proximi_error_log;
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/javascript application/json application/xml+rss application/font-woff2 application/font-woff;
    
    # Redirect root path to /apps
    location = / {
        return 302 /org;
    }
    
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
        # WebSockets support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        error_page 502 503 504 = /maintenance.html;
    }
    location = /maintenance.html {
        root /usr/share/nginx/html;
    }
    ssl_certificate /etc/letsencrypt/live/app.li2.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.li2.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}